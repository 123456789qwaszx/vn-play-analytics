spring.application.name=vn-play-analytics-test

spring.datasource.url=${VN_TEST_DB_URL:jdbc:mysql://localhost:3308/vn_analytics_test}
spring.datasource.username=${VN_TEST_DB_USERNAME:vn_test}
spring.datasource.password=${VN_TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false